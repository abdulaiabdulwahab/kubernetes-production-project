apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: store-web-hpa
  namespace: store-prod

spec:

  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: store-web

  # Never run fewer than three replicas
  minReplicas: 3

  # Never automatically exceed ten
  maxReplicas: 10

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization
          averageUtilization: 50